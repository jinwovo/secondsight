name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run the test suite
        run: node --test test/test.js

  selfcheck:
    # The tool scans its own source. A commit that smuggles an invisible
    # character into this repository fails the build that would have merged it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: secondsight scans secondsight
        run: node cli.js src cli.js index.html assets test README.md action.yml --fail-on medium --no-color
