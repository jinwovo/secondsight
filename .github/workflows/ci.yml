name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run the test suite
        run: node --test test/test.js

  selfcheck:
    # The tool scans its own source. A commit that smuggles an invisible
    # character into this repository fails the build that would have merged it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Twice: the code has to be spotless, and the two files that are corpora
      # of deliberate attacks -- the specimen gallery and the test suite --
      # are scanned with exactly the rules they are meant to trip named here,
      # in the open, rather than hidden behind an ignore file.
      - name: secondsight scans its own code
        run: >-
          node cli.js src cli.js index.html assets test README.md action.yml
          --fail-on medium --no-color
          --exclude src/specimens.js --exclude test/test.js
      - name: secondsight scans its own attack corpus
        run: >-
          node cli.js src/specimens.js test/test.js
          --fail-on medium --no-color
          --ignore styled-hidden-text,instruction-comment,encoded-instructions,link-label-mismatch,exfil-image,executable-href
