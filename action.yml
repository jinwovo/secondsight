name: 'secondsight scan'
description: 'Find and decode what a file is hiding: invisible Unicode, Trojan Source, prompt injection styled out of the page.'
author: 'jinwovo'

# `name` is the Marketplace listing title and nothing else -- consumers still
# write `uses: jinwovo/secondsight@v1`, which is resolved from the repository
# path. It cannot be plain 'secondsight': the Marketplace rejects a name that
# matches any existing action, user or organization, and github.com/secondsight
# is an account that has existed since 2013. The description has a hard
# 125-character limit there, too.

branding:
  icon: 'eye'
  color: 'red'

inputs:
  paths:
    description: 'Space-separated files or directories to scan.'
    required: false
    default: '.'
  fail-on:
    description: 'Minimum severity that fails the build: info | low | medium | high | critical.'
    required: false
    default: 'high'
  sarif:
    description: 'When set to an output path, write SARIF for GitHub code scanning instead of gating the build. Pair with github/codeql-action/upload-sarif.'
    required: false
    default: ''
  args:
    description: 'Extra arguments passed through to the CLI, for example --json, or --exclude and --ignore for a corpus of deliberate samples.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - shell: bash
      # $GITHUB_ACTION_PATH is this action's own checkout; the CLI resolves its
      # imports relative to its own file, so it runs correctly from any working
      # directory and scans the caller's checked-out repository. With `sarif`
      # set it writes a report and succeeds so the upload step can run; without
      # it, the action is a pass/fail gate on the given severity.
      #
      # Inputs arrive through the environment, never through `${{ }}` in the
      # script body: an expression is pasted into the shell source before bash
      # parses it, so an input holding `$(...)` would run as a command. An
      # unquoted variable is only split into words, and `set -f` stops those
      # words from being expanded as globs.
      env:
        SS_PATHS: ${{ inputs.paths }}
        SS_FAIL_ON: ${{ inputs.fail-on }}
        SS_SARIF: ${{ inputs.sarif }}
        SS_ARGS: ${{ inputs.args }}
      run: |
        set -f
        if [ -n "$SS_SARIF" ]; then
          node "$GITHUB_ACTION_PATH/cli.js" $SS_PATHS --sarif "$SS_SARIF" $SS_ARGS
        else
          node "$GITHUB_ACTION_PATH/cli.js" $SS_PATHS --fail-on "$SS_FAIL_ON" --no-color $SS_ARGS
        fi
